<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>해열제 안심 계산기 | uridaylog</title>
  <meta name="description" content="아기 몸무게로 해열제(아세트아미노펜·이부프로펜·덱시부프로펜) 1회 용량을 계산하고, 복용 시간을 기록하면 다음 복용·교차복용 가능 시각을 알려드려요. 응급실 판단 기준까지." />
  <meta name="theme-color" content="#FBF6F0" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="해열제 안심 계산기" />
  <meta property="og:description" content="몸무게만 넣으면 시럽 몇 ml인지, 다음 복용은 몇 시인지. 새벽에 헤매지 마세요." />
  <meta property="og:locale" content="ko_KR" />
  <meta property="og:url" content="https://wkdwlsgh29-del.github.io/uridaylog/fever/" />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌡️</text></svg>" />

  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="../shared/css/base.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="shell">

    <header class="top">
      <span class="brand-mark"><span class="logo">🌡️</span><span id="brandName">uridaylog</span></span>
      <a id="brandIg" class="chip chip-brand" href="#" target="_blank" rel="noopener">Instagram</a>
    </header>

    <section class="hero" id="hero">
      <h1>열나는 새벽,<br /><em>몇 ml인지 몇 시인지</em><br />헤매지 마세요</h1>
      <p class="sub">몸무게로 해열제 용량 계산 + 복용 기록 + 다음 복용 시각.<br />응급실 판단 기준까지 한 화면에.</p>
    </section>

    <section class="card input-card">
      <div class="row two-col">
        <div>
          <label class="field-label" for="weight">몸무게 kg</label>
          <input class="field" type="number" id="weight" inputmode="decimal" step="0.1" min="2" max="40" placeholder="예: 9.5" />
        </div>
        <div>
          <label class="field-label" for="babyBirth">생년월일 <span class="optional-tag">(권장)</span></label>
          <input class="field" type="date" id="babyBirth" />
        </div>
      </div>
      <button class="btn btn-primary" id="makeBtn">용량 계산하기</button>
    </section>

    <section id="result" class="hidden">

      <div class="card timer-card" id="timerCard"></div>

      <div id="drugCards"></div>

      <div class="card danger-card">
        <h3>🚨 이럴 땐 바로 병원·응급실</h3>
        <ul id="redFlags"></ul>
      </div>

      <div class="guide">
        <h3>열 관리, 이것만 기억하세요</h3>
        <ul id="tipsList"></ul>
      </div>

      <div class="card log-card" id="logCard"></div>

    </section>

    <footer class="foot">
      <a id="footIg" class="ig" href="#" target="_blank" rel="noopener">📷 <span id="footIgHandle"></span></a>
      <div class="made">위급할 때 바로 열 수 있게 홈 화면에 저장해 두세요 🙏</div>
      <p class="disclaimer" id="disclaimer"></p>
    </footer>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
